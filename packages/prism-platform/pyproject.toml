[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-platform"
version = "1.0.0"
readme = "README.md"
description = "Experimental platform-domain and workflow models for Prism."
license = "MIT"
license-files = ["LICENSES/MIT.txt"]
requires-python = ">=3.12"
dependencies = ["prism-language==1.0.0", "prism-runtime==1.0.0", "pydantic>=2.8", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["prism.platform*"]
namespaces = true
