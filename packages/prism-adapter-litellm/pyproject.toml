[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-adapter-litellm"
version = "1.0.0"
readme = "README.md"
description = "Structured AI.Generate effect handler for Prism backed by LiteLLM."
license = "MIT"
license-files = ["LICENSES/MIT.txt"]
requires-python = ">=3.12"
dependencies = ["prism-runtime==1.0.0", "litellm>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["prism.adapters.litellm*"]
namespaces = true
