[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-language"
version = "1.0.0"
readme = "README.md"
description = "Provider-free Prism parser, compiler, proof checker, command IR, and trusted evidence kernel."
license = "MIT"
license-files = ["LICENSES/MIT.txt"]
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
include = ["prism.language*"]
namespaces = true
