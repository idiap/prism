[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-runtime"
version = "1.0.0"
readme = "README.md"
description = "Fail-closed execution of compiled Prism command IR through typed effect handlers."
license = "MIT"
license-files = ["LICENSES/MIT.txt"]
requires-python = ">=3.12"
dependencies = ["prism-language==1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["prism.runtime*"]
namespaces = true
